# OpsBrain — local development environment
#
# Stage 1 (RAG agent only):
#   docker compose up postgres rag-agent
#
# Full stack (all agents + Kafka + Prometheus):
#   docker compose --profile full up
#
# First-time setup:
#   1. cp .env.example .env  →  fill in GOOGLE_API_KEY (free tier: aistudio.google.com/apikey)
#   2. docker compose up postgres rag-agent
#   3. curl -X POST http://localhost:8001/ingest -H "Content-Type: application/json" \
#        -d '{"directory": "./docs"}'
#   4. curl -X POST http://localhost:8001/query -H "Content-Type: application/json" \
#        -d '{"question": "What should I do when CPU is high?"}'

services:

  # ── PostgreSQL + pgvector ───────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB:       opsbrain
      POSTGRES_USER:     opsbrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"   # 5432/5433 remapped: host already runs two native Postgres instances on those ports
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsbrain -d opsbrain"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RAG Agent (Stage 1) ─────────────────────────────────────────────────────
  rag-agent:
    build:
      context: .
      dockerfile: agents/rag/Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      GOOGLE_API_KEY:         ${GOOGLE_API_KEY}
      GOOGLE_EMBEDDING_MODEL: models/gemini-embedding-001
      GOOGLE_CHAT_MODEL:      gemini-3.6-flash
      POSTGRES_HOST:          postgres
      POSTGRES_PORT:          5432
      POSTGRES_DB:            opsbrain
      POSTGRES_USER:          opsbrain
      POSTGRES_PASSWORD:      ${POSTGRES_PASSWORD}
    volumes:
      - ./docs:/app/docs:ro   # mount docs so you can add runbooks without rebuilding
    depends_on:
      postgres:
        condition: service_healthy

  # ── Orchestrator (Stage 2) ──────────────────────────────────────────────────
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    depends_on:
      - rag-agent
    profiles: [full]

  # ── Monitoring Agent (Stage 2) ──────────────────────────────────────────────
  monitoring-agent:
    build:
      context: .
      dockerfile: agents/monitoring/Dockerfile
    restart: unless-stopped
    ports:
      - "8002:8002"
    profiles: [full]

  # ── Infra Agent (Stage 2) ───────────────────────────────────────────────────
  infra-agent:
    build:
      context: .
      dockerfile: agents/infra/Dockerfile
    restart: unless-stopped
    ports:
      - "8003:8003"
    profiles: [full]

  # ── Code Agent (Stage 2) ────────────────────────────────────────────────────
  code-agent:
    build:
      context: .
      dockerfile: agents/code/Dockerfile
    restart: unless-stopped
    ports:
      - "8004:8004"
    profiles: [full]

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    profiles: [full]

  # ── Kafka (Stage 2) ─────────────────────────────────────────────────────────
  kafka:
    image: bitnamilegacy/kafka:3.7
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID:                        0
      KAFKA_CFG_PROCESS_ROLES:                  controller,broker
      KAFKA_CFG_LISTENERS:                      PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS:           PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS:       0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES:      CONTROLLER
    volumes:
      - kafka_data:/bitnami/kafka
    profiles: [full]

volumes:
  postgres_data:
  kafka_data:
  prometheus_data:
