# Minimal scrape config for local dev.
# Agents don't expose /metrics yet (Stage 2 work) — targets will show as
# "down" until each service adds a metrics endpoint. Prometheus itself
# always scrapes cleanly, which is enough to prove the container boots.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: ["orchestrator:8000"]

  - job_name: rag-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["rag-agent:8001"]

  - job_name: monitoring-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["monitoring-agent:8002"]

  - job_name: infra-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["infra-agent:8003"]

  - job_name: code-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["code-agent:8004"]
