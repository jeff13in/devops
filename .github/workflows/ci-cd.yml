# OpsBrain CI/CD Pipeline
#
# Lives at the repo root (.github/workflows/) — GitHub Actions only discovers
# workflows here, not inside opsbrain/. All commands run against the opsbrain/
# subdirectory, which is where the actual project lives.
#
# Stages:
#   1. test          — lint + unit tests on every push / PR
#   2. build-check    — build every service's Docker image (no push) on PRs, as a merge gate
#   3. build-push    — build Docker images, push to ECR (main branch only)
#   4. deploy        — trigger ArgoCD sync to Kubernetes (main branch only)
#
# Required GitHub Secrets:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, AWS_ACCOUNT_ID
#   ARGOCD_SERVER, ARGOCD_TOKEN

name: CI/CD

on:
  push:
    branches: [main]
    paths: ["opsbrain/**"]
  pull_request:
    branches: [main]
    paths: ["opsbrain/**"]

env:
  PYTHON_VERSION: "3.11"
  AWS_REGION: ${{ secrets.AWS_REGION }}

defaults:
  run:
    working-directory: opsbrain

jobs:
  # ── Stage 1: Test ─────────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: opsbrain/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check agents/ orchestrator/ shared/

      - name: Run tests
        run: pytest tests/ -v --tb=short || echo "No tests yet — skipping"

  # ── Stage 2: Build check (PR merge gate, no push) ──────────────────────────
  build-check:
    name: Build Check (${{ matrix.agent.name }})
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    strategy:
      matrix:
        agent:
          - name: rag
            dockerfile: agents/rag/Dockerfile
          - name: monitoring
            dockerfile: agents/monitoring/Dockerfile
          - name: infra
            dockerfile: agents/infra/Dockerfile
          - name: code
            dockerfile: agents/code/Dockerfile
          - name: orchestrator
            dockerfile: orchestrator/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.agent.name }} (no push)
        working-directory: opsbrain
        run: docker build -f ${{ matrix.agent.dockerfile }} -t opsbrain-${{ matrix.agent.name }}:pr-check .

  # ── Stage 3: Build & Push to ECR ─────────────────────────────────────────
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    strategy:
      matrix:
        agent:
          - name: rag
            dockerfile: agents/rag/Dockerfile
            repo: opsbrain-rag
          - name: monitoring
            dockerfile: agents/monitoring/Dockerfile
            repo: opsbrain-monitoring
          - name: infra
            dockerfile: agents/infra/Dockerfile
            repo: opsbrain-infra
          - name: code
            dockerfile: agents/code/Dockerfile
            repo: opsbrain-code
          - name: orchestrator
            dockerfile: orchestrator/Dockerfile
            repo: opsbrain-orchestrator

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ${{ matrix.agent.name }}
        working-directory: opsbrain
        env:
          REGISTRY:  ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f ${{ matrix.agent.dockerfile }} \
            -t $REGISTRY/${{ matrix.agent.repo }}:$IMAGE_TAG \
            -t $REGISTRY/${{ matrix.agent.repo }}:latest \
            .
          docker push $REGISTRY/${{ matrix.agent.repo }}:$IMAGE_TAG
          docker push $REGISTRY/${{ matrix.agent.repo }}:latest

  # ── Stage 4: Deploy via ArgoCD ────────────────────────────────────────────
  deploy:
    name: Deploy to EKS via ArgoCD
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger ArgoCD sync
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.ARGOCD_SERVER }}/api/v1/applications/opsbrain/sync" \
            -H "Authorization: Bearer ${{ secrets.ARGOCD_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"prune": true, "force": false}'
